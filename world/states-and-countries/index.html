/* ---------- maps: land drawn in one colour, with no borders between countries ---------- */
function drawMap(svg, w, h, fitTo, places, onTap, labelOf) {
  const proj = (fitTo ? d3.geoMercator().fitExtent([[6, 6], [w - 6, h - 6]], fitTo) : d3.geoNaturalEarth1().fitExtent([[6, 6], [w - 6, h - 6]], { type: 'Sphere' }));
  const path = d3.geoPath(proj);
  el(fitTo ? 'rect' : 'path', fitTo ? { x: 0, y: 0, width: w, height: h, class: 'ocean' } : { d: path({ type: 'Sphere' }), class: 'ocean' }, svg);
  const lg = el('g', {}, svg); feats.forEach(f => el('path', { d: path(f), class: 'land' }, lg));
  return places.map((p, i) => {
    const [x, y] = proj([p.lon, p.lat]);
    const g = el('g', { class: 'pin', transform: `translate(${x.toFixed(1)},${y.toFixed(1)})` }, svg);
    el('circle', { r: 11, fill: 'transparent' }, g); el('circle', { r: 5, class: 'd' }, g);
    const t = el('text', { y: -8, 'text-anchor': 'middle' }, g); t.textContent = labelOf(p); t.style.display = 'none';
    g.addEventListener('click', () => onTap(i));
    return { g, t };
  });
}

function mark(pins, list, set, i) {

  ch.check({ state: s[0], seenIn: seenIn.size, uts: [...seenIn].filter(k => IN[k][7]).length });
}

  { ask: 'Visit 10 states or union territories 🇮🇳', hint: 'Tap names in the list or dots on the map.', ok: c => c.seenIn >= 10, yay: 'Ten places across India!' },
  { ask: 'Find a country where people also speak Tamil 🌏', hint: 'Look at India\'s neighbours, and a little island country far to the south-east.', ok: c => c.country === 'Sri Lanka' || c.country === 'Singapore', yay: c => `Yes! People speak Tamil in ${c.country} too!` },
  { ask: 'Visit a country on every continent 🌍', hint: 'Open Countries of the World and try each group.', ok: c => c.conts >= 6, yay: 'You travelled the whole world!' },
  { ask: 'Get a quiz question right ❓', hint: 'Open the Quiz tab. Try India and World!', ok: c => !!c.quiz, yay: 'Geography star!' },
], { title: 'Map Explorer' });
Kids.learn({
  why: ['India is divided into 28 states and 8 union territories. Each state has its own capital city, where its government works.',
    'Many Indian states were made so that people who speak the same language live in the same state. That is why Karnataka speaks Kannada and Tamil Nadu speaks Tamil!'],
  imagine: ['Imagine a train journey from Kashmir to Kanyakumari. At every big station, people say hello differently: Salaam, Namaste, Namaskar, Namaskara, Vanakkam! 🚂'],
  wow: ['India has 22 official languages in its Constitution, and hundreds more spoken every day!', 'Chandigarh is the capital of two states, Punjab and Haryana, and is also a union territory itself!',
    'Tamil is an official language in India, Sri Lanka and Singapore. 🌺'],
  talk: ['Which state would you like to visit next? Why?', 'How many languages does our family speak?', 'Can you learn to say hello in 5 languages?'],
});
$('#info').innerHTML = '<div class="e">🗺️</div><h2>Let\'s explore!</h2><p>Tap a state on the map or in the list to see its capital, its language, and how people say hello.</p>';
</script>
