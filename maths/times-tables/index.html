<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Times Tables</title>
<link rel="stylesheet" href="../../shared/kids.css?v=5">
<style>
  .arr { display: inline-grid; gap: 4px; margin: 8px auto; }
  .arr span { font-size: 30px; line-height: 1; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .fact { background: #f8f6ff; border-radius: 14px; padding: 8px; font-size: 20px; font-weight: 600; text-align: center; border: 3px solid transparent; }
  .fact.on { border-color: #ffd166; background: #fffbea; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="big">🐸</span>
    <div><h1>Times Tables</h1><small>Jump along the number line, <b data-kid-name>Kavikuyil</b>!</small></div>
  </div>
  <div class="badges" data-kids-badges data-home="../../index.html"></div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="jump">🐸 Frog Jumps</button>
  <button class="tab" data-tab="groups">🍎 Groups</button>
  <button class="tab" data-tab="quiz">❓ Quiz</button>
</nav>

<main class="split">
  <div>
    <section class="card center"><div class="label" style="margin-top:0">Which table?</div><div class="pick" id="tbl"></div></section>
    <section class="card center" data-panel="jump">
      <svg id="line" class="svgbox" viewBox="0 0 820 200"></svg>
      <div class="result" id="jRes"></div>
      <div class="row"><button class="btn big green" id="jumpBtn">🐸 Jump!</button><button class="btn orange" id="resetBtn">↩️ Start again</button></div>
    </section>
    <section class="card center" data-panel="groups" hidden>
      <div class="label" style="margin-top:0">How many groups?</div>
      <div class="pick" id="grpN"></div>
      <div id="arr"></div>
      <div class="result" id="gRes"></div>
    </section>
    <section class="card" id="quizBox" data-panel="quiz" hidden></section>
  </div>
  <div>
    <section class="card"><h3 style="margin:0 0 8px">📜 The table</h3><div class="facts" id="facts"></div></section>
    <section class="card" data-kuyil></section>
  </div>
</main>

<section data-learn></section>
<footer>Made with ❤️ for <span data-kid-name>Kavikuyil</span> · Numbers 🔢</footer>

<script src="../../shared/kids.js?v=5"></script>
<script>
const $ = s => document.querySelector(s);
const R = Kids.rand, shuffle = Kids.shuffle, el = Kids.svgEl;
const TABLES = [2, 3, 4, 5, 10];
const EMO = { 2: '🧦', 3: '🍀', 4: '🐾', 5: '✋', 10: '🔟' };
const WHY = { 2: 'socks come in pairs', 3: 'a clover has 3 leaves', 4: 'a dog has 4 paws', 5: 'a hand has 5 fingers', 10: 'ten fingers' };
let t = 2, jumps = 0, tablesDone = new Set();
TABLES.forEach(n => {
  const b = document.createElement('button'); b.textContent = `${n}×`; b.className = n === t ? 'active' : '';
  b.addEventListener('click', () => { t = n; Kids.sfx.pop(); [...$('#tbl').children].forEach(x => x.classList.toggle('active', x === b)); resetJump(); drawGroups(); drawFacts(); if (quizOn) startQuiz(); });
  $('#tbl').appendChild(b);
});
function drawFacts() { $('#facts').innerHTML = Array.from({ length: 10 }, (_, i) => `<div class="fact${i < jumps ? ' on' : ''}">${i + 1} × ${t} = ${(i + 1) * t}</div>`).join(''); }

/* ---------- frog jumps on a number line ---------- */
function drawLine() {
  const s = $('#line'); s.innerHTML = '';
  const max = t * 10, x = v => 30 + v / max * 760;
  el('line', { x1: 20, y1: 150, x2: 800, y2: 150, stroke: '#2b2d42', 'stroke-width': 4 }, s);
  const step = t === 10 ? 10 : t <= 3 ? 1 : t;
  for (let v = 0; v <= max; v += step) {
    const big = v % t === 0;
    el('line', { x1: x(v), y1: 140, x2: x(v), y2: 160, stroke: '#2b2d42', 'stroke-width': big ? 3 : 1 }, s);
    if (big) el('text', { x: x(v), y: 185, 'text-anchor': 'middle', 'font-size': max > 40 ? 15 : 18, fill: v <= jumps * t ? '#9b5de5' : '#6c6f93', 'font-weight': 700 }, s).textContent = v;
  }
  for (let i = 0; i < jumps; i++) {
    const a = x(i * t), b = x((i + 1) * t), m = (a + b) / 2;
    el('path', { d: `M${a} 140 Q ${m} ${60} ${b} 140`, fill: 'none', stroke: '#06d6a0', 'stroke-width': 3, 'stroke-dasharray': '6 5' }, s);
    el('text', { x: m, y: 90, 'text-anchor': 'middle', 'font-size': 14, fill: '#04a08a', 'font-weight': 700 }, s).textContent = `+${t}`;
  }
  el('text', { x: x(jumps * t), y: 135, 'text-anchor': 'middle', 'font-size': 38 }, s).textContent = '🐸';
}
function resetJump() { jumps = 0; drawLine(); drawFacts(); $('#jRes').className = 'result'; $('#jRes').textContent = `The frog jumps ${t} at a time. Tap Jump!`; }
$('#jumpBtn').addEventListener('click', () => {
  if (jumps >= 10) return;
  jumps++; Kids.sfx.boing(); drawLine(); drawFacts();
  const v = jumps * t;
  $('#jRes').className = 'result good';
  $('#jRes').textContent = `${jumps} jump${jumps > 1 ? 's' : ''} of ${t} = ${v}`;
  Kids.speak(`${v}`, false, 1);
  if (jumps === 10) { Kids.addStar(); Kids.confetti(); tablesDone.add(t); $('#jRes').textContent = `🎉 10 jumps of ${t} = ${v}! You skip-counted the whole ${t} times table!`; Kids.speak(`Wonderful! You counted in ${t}s all the way to ${v}!`); ch.check({ table: t, done: tablesDone.size }); }
});
$('#resetBtn').addEventListener('click', () => { Kids.sfx.pop(); resetJump(); });

/* ---------- groups (arrays) ---------- */
let g = 3;
for (let i = 1; i <= 10; i++) { const b = document.createElement('button'); b.textContent = i; b.className = i === g ? 'active' : '';
  b.addEventListener('click', () => { g = i; Kids.sfx.pop(); [...$('#grpN').children].forEach(x => x.classList.toggle('active', x === b)); drawGroups(); }); $('#grpN').appendChild(b); }
function drawGroups() {
  const e = EMO[t];
  $('#arr').innerHTML = `<div class="arr" style="grid-template-columns:repeat(${t}, auto)">${Array.from({ length: g * t }, () => `<span>${e}</span>`).join('')}</div>`;
  $('#gRes').innerHTML = `${g} group${g > 1 ? 's' : ''} of ${t} = ${Array(g).fill(t).join(' + ')} = <b>${g * t}</b><br><small>(${t}, because ${WHY[t]}) → ${g} × ${t} = ${g * t}</small>`;
  ch && ch.check({ groups: g });
}
/* ---------- quiz ---------- */
function quizMaker() {
  const a = 1 + R(10), ans = a * t;
  const kind = R(3);
  const o = new Set([ans]); while (o.size < 4) { const w = ans + (R(2) ? 1 : -1) * t * (1 + R(2)); if (w > 0) o.add(w); else o.add(ans + 1 + R(3)); }
  if (kind === 0) return { q: `${a} × ${t} = ?`, choices: shuffle([...o]).map(x => ({ label: String(x), ok: x === ans })), yay: `${a} × ${t} = ${ans}`, hint: `Count in ${t}s, ${a} times.` };
  if (kind === 1) return { q: `<div style="font-size:36px">${(EMO[t] + ' ').repeat(t).trim()}</div>${a} ${a > 1 ? 'groups' : 'group'} like this. How many altogether?`, choices: shuffle([...o]).map(x => ({ label: String(x), ok: x === ans })), yay: `${a} groups of ${t} make ${ans}.`, hint: 'Try it on the Groups tab!' };
  const seq = [1, 2, 3, 4].map(k => (a > 6 ? a - 4 + k : a + k - 1) * t), miss = R(4), m = seq[miss];
  const o2 = new Set([m]); while (o2.size < 4) o2.add(m + (R(2) ? 1 : -1) * (1 + R(t)));
  return { q: `What is missing?<br>${seq.map((v, i) => i === miss ? '<b style="color:var(--red)">?</b>' : v).join(' , ')}`, choices: shuffle([...o2]).map(x => ({ label: String(x), ok: x === m })), yay: `Counting in ${t}s: ${seq.join(', ')}.`, hint: `Each number is ${t} more than the one before.` };
}
let quizOn = false;
const startQuiz = () => Kids.quiz('#quizBox', quizMaker, { rounds: 8, onRight: () => ch.check({ quiz: true }) });
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  Kids.sfx.pop();
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('[data-panel]').forEach(p => p.hidden = p.dataset.panel !== b.dataset.tab);
  if (b.dataset.tab === 'quiz' && !quizOn) { quizOn = true; startQuiz(); }
}));
let ch = null;
ch = Kids.challenges([
  { ask: 'Make the frog jump 10 times in the 2 times table 🐸', hint: 'Pick 2×, then tap Jump 10 times.', ok: c => c.table === 2, yay: '2, 4, 6, 8, 10… you can count in twos!' },
  { ask: 'Make 4 groups on the Groups tab 🍎', hint: 'Open Groups and tap 4.', ok: c => c.groups === 4, yay: '4 groups! Multiplying means adding equal groups.' },
  { ask: 'Finish the 5 times table ✋', hint: 'Pick 5× and jump 10 times.', ok: c => c.table === 5, yay: 'Count in fives, like fingers on hands!' },
  { ask: 'Get a quiz question right ❓', hint: 'Open the Quiz tab.', ok: c => c.quiz, yay: 'Times table star!' },
  { ask: 'Finish 3 different tables 🏆', hint: 'Try 3×, 4× and 10× too.', ok: c => c.done >= 3, yay: 'Three tables! Amazing!' },
], { title: 'Tables Champion' });
Kids.learn({
  why: ['"Times" means "groups of". 3 × 2 means 3 groups of 2: 2 + 2 + 2 = 6.',
    'Instead of adding the same number again and again, times tables let you jump straight to the answer, like a frog! 🐸'],
  imagine: ['Imagine 4 dogs. Each has 4 paws. Count the paws by fours: 4, 8, 12, 16! 🐾'],
  wow: ['3 × 4 is the same as 4 × 3. Turn the groups around and you get the same total!',
    'The 10 times table is easy: just put a 0 at the end. 7 × 10 = 70!'],
  talk: ['How many wheels on 3 cycles? On 3 cars?', 'Count the eyes of everyone at home in twos.', 'Which table do you think is easiest? Why?'],
});
resetJump(); drawGroups();
</script>
</body>
</html>
