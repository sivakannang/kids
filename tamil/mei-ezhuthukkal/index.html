<header>
  <div class="logo">
    <span class="big" style="font-family:'Tamil Sangam MN','Noto Sans Tamil','Latha','Nirmala UI',sans-serif">க்</span>
    <div><h1>Mei Ezhuthukkal <span style="font-family:'Tamil Sangam MN','Noto Sans Tamil','Latha','Nirmala UI',sans-serif">மெய் எழுத்துக்கள்</span></h1><small>The 18 Tamil consonants, <b data-kid-name>Kavikuyil</b>!</small></div>
  </div>

<main data-letters></main>

<script src="../../shared/kids.js?v=4"></script>
<script src="../../shared/letters.js?v=4"></script>
<script>
Kids.lettersGame({
  lang: 'ta', langName: 'Tamil', what: 'mei letter', find: 'inside', font: "'Tamil Sangam MN', 'Noto Sans Tamil', 'Latha', 'Nirmala UI', sans-serif",
  kinds: {
    val: { label: 'Vallinam: hard sounds வல்லினம்', bg: 'linear-gradient(135deg, #ef476f, #c9184a)' },
    mel: { label: 'Mellinam: soft sounds மெல்லினம்', bg: 'linear-gradient(135deg, #3aa6dd, #118ab2)' },
    idai: { label: 'Idaiyinam: in-between sounds இடையினம்', bg: 'linear-gradient(135deg, #2ec4b6, #04a08a)' },
  },
  letters: [
    ['க்', 'k', 'val', 'தக்காளி', 'thakkaali', 'tomato', '🍅'],
    ['ங்', 'ng', 'mel', 'சங்கு', 'sangu', 'conch shell', '🐚'],
    ['ச்', 'ch', 'val', 'பச்சை', 'pachchai', 'green', '🟢'],
    ['ஞ்', 'nj', 'mel', 'ஊஞ்சல்', 'oonjal', 'swing', '🎠'],
    ['ட்', 'T (hard)', 'val', 'பட்டம்', 'pattam', 'kite', '🪁'],
    ['ண்', 'N (hard)', 'mel', 'கண்', 'kan', 'eye', '👁️'],
    ['த்', 'th', 'val', 'புத்தகம்', 'puththagam', 'book', '📖'],
    ['ந்', 'n (teeth)', 'mel', 'பந்து', 'pandhu', 'ball', '⚽'],
    ['ப்', 'p', 'val', 'கப்பல்', 'kappal', 'ship', '🚢'],
    ['ம்', 'm', 'mel', 'மரம்', 'maram', 'tree', '🌳'],
    ['ய்', 'y', 'idai', 'நாய்', 'naai', 'dog', '🐶'],
    ['ர்', 'r', 'idai', 'கார்', 'kaar', 'car', '🚗'],
    ['ல்', 'l', 'idai', 'பல்', 'pal', 'tooth', '🦷'],
    ['வ்', 'v', 'idai', 'செவ்வாய்', 'sevvaai', 'Mars, the red planet', '🔴'],
    ['ழ்', 'zh', 'idai', 'தமிழ்', 'thamizh', 'Tamil!', '🌺'],
    ['ள்', 'L (hard)', 'idai', 'வாள்', 'vaal', 'sword', '🗡️'],
    ['ற்', 'R (hard)', 'val', 'காற்று', 'kaatru', 'wind', '🌬️'],
    ['ன்', 'n', 'mel', 'மீன்', 'meen', 'fish', '🐟'],
  ],
});
Kids.learn({
  why: ['மெய் (mei) means "body". The 18 mei letters are the consonants. See the little dot on top? It is called the புள்ளி (pulli). It means "say only the consonant sound".',
    'When a mei letter (body) meets an uyir letter (life), they make an uyirmei letter: க் + அ = க (ka). 12 × 18 = 216 uyirmei letters!'],
  imagine: ['Imagine the mei letter is a quiet body, and the uyir letter is its breath of life. When they hold hands, the letter wakes up and sings: க் + ஆ = கா! 🎶'],
  wow: ['ழ (zh) is a very special sound. Only a few languages in the whole world have it, and it is in the word தமிழ் (Thamizh) itself!',
    'The 18 letters are 3 groups of 6: hard sounds (வல்லினம்), soft sounds (மெல்லினம்) and in-between sounds (இடையினம்).'],
  talk: ['Ask Amma or Appa to say தமிழ், வாழைப்பழம் and மழை. Can you hear the ழ?', 'Which mei letter is in your name?', 'Can you find a mei letter with a pulli on a Tamil calendar at home?'],
});
</script>

</html>
