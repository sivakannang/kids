<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamil Numbers &amp; Colours</title>
<link rel="stylesheet" href="../../shared/kids.css?v=3">
<style>
  .ta { font-family: 'Tamil Sangam MN', 'Noto Sans Tamil', 'Latha', 'Nirmala UI', sans-serif; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .nc { border: none; border-radius: 20px; padding: 12px 8px; cursor: pointer; font-family: inherit; background: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.06), 0 8px 20px rgba(60,60,120,.08); text-align: center; }
  .nc .n { font-size: 40px; font-weight: 700; color: var(--purple); }
  .nc .dots { font-size: 18px; min-height: 26px; letter-spacing: 1px; }
  .nc .t { font-size: 26px; }
  .nc .r { font-size: 15px; color: var(--muted); font-weight: 600; }
  .nc.seen { outline: 4px solid #ffd166; }
  .sw { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 6px; border: 3px solid #eee; }
  .voice-note { font-size: 14px; color: var(--muted); text-align: center; margin-top: 10px; }
  .choice .ta { font-size: 30px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="big">🔢</span>
    <div><h1>Tamil Numbers &amp; Colours <span class="ta">எண்கள் · நிறங்கள்</span></h1><small>Count and name colours in Tamil, <b data-kid-name>Kavikuyil</b>!</small></div>
  </div>
  <div class="badges" data-kids-badges data-home="../../index.html"></div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="nums">🔢 Numbers 1–10</button>
  <button class="tab" data-tab="cols">🎨 Colours</button>
  <button class="tab" data-tab="quiz">❓ Quiz</button>
</nav>

<main class="page">
  <section class="card" data-kuyil></section>
  <section class="card" data-panel="nums"><div class="cards" id="nums"></div><div class="voice-note" id="voiceNote"></div></section>
  <section class="card" data-panel="cols" hidden><div class="cards" id="cols"></div></section>
  <section class="card" id="quizBox" data-panel="quiz" hidden></section>
</main>

<section data-learn></section>
<footer>Made with ❤️ for <span data-kid-name>Kavikuyil</span> · தமிழ் 🌺</footer>

<script src="../../shared/kids.js?v=3"></script>
<script>
const $ = s => document.querySelector(s);
const R = Kids.rand, shuffle = Kids.shuffle;
const NUMS = [[1,'ஒன்று','onru'],[2,'இரண்டு','irandu'],[3,'மூன்று','moonru'],[4,'நான்கு','naangu'],[5,'ஐந்து','aindhu'],
  [6,'ஆறு','aaru'],[7,'ஏழு','ezhu'],[8,'எட்டு','ettu'],[9,'ஒன்பது','onbadhu'],[10,'பத்து','pathu']];
const COLS = [['சிவப்பு','sivappu','red','#ef233c'],['நீலம்','neelam','blue','#1e6fd9'],['பச்சை','pachai','green','#2a9d48'],['மஞ்சள்','manjal','yellow','#ffd60a'],
  ['கருப்பு','karuppu','black','#1b1b1b'],['வெள்ளை','vellai','white','#ffffff'],['ஊதா','oodhaa','purple','#8e44ad'],['ஆரஞ்சு','aaranju','orange','#ff8c1a'],
  ['பழுப்பு','pazhuppu','brown','#8b5a2b'],['இளஞ்சிவப்பு','ilanjivappu','pink','#ff8fc1']];
const THINGS = ['🍎','⭐','🐟','🌸','🎈','🍌','🐞','🚗'];

let taVoice = null;
function findVoice() { try { taVoice = speechSynthesis.getVoices().find(v => /^ta/i.test(v.lang)) || null; } catch {}
  $('#voiceNote').textContent = taVoice ? `🔊 Using the Tamil voice "${taVoice.name}".` : '🔇 This device has no Tamil voice, so read the sounds (in grey) out loud together!'; }
try { speechSynthesis.onvoiceschanged = findVoice; } catch {}
function sayTa(ta, en) {
  try { speechSynthesis.cancel();
    if (taVoice) { const u = new SpeechSynthesisUtterance(ta); u.voice = taVoice; u.lang = taVoice.lang; u.rate = 0.8; speechSynthesis.speak(u); }
    else Kids.speak(en, true); } catch {}
}
const seenN = new Set(), seenC = new Set();
NUMS.forEach(([n, t, r]) => {
  const b = document.createElement('button'); b.className = 'nc';
  b.innerHTML = `<div class="n">${n}</div><div class="dots">${THINGS[n % THINGS.length].repeat(n)}</div><div class="t ta">${t}</div><div class="r">${r}</div>`;
  b.addEventListener('click', () => { sayTa(t, r); seenN.add(n); b.classList.add('seen'); Kids.sfx.pop(); ch.check({ n, seenN: seenN.size }); });
  $('#nums').appendChild(b);
});
COLS.forEach(([t, r, en, c]) => {
  const b = document.createElement('button'); b.className = 'nc';
  b.innerHTML = `<div class="sw" style="background:${c}"></div><div class="t ta">${t}</div><div class="r">${r} · ${en}</div>`;
  b.addEventListener('click', () => { sayTa(t, r); seenC.add(en); b.classList.add('seen'); Kids.sfx.pop(); ch.check({ col: en, seenC: seenC.size }); });
  $('#cols').appendChild(b);
});

const pick4 = (list, a) => { const o = new Set([a]); while (o.size < 4) o.add(list[R(list.length)]); return shuffle([...o]); };
const MAKERS = [
  () => { const a = NUMS[R(NUMS.length)], th = THINGS[R(THINGS.length)];
    return { q: `<div style="font-size:40px;max-width:460px;margin:auto">${th.repeat(a[0])}</div>How many? Say it in Tamil!`,
      choices: pick4(NUMS, a).map(x => ({ label: `<span class="ta">${x[1]}</span><br><small>${x[2]}</small>`, ok: x === a })), yay: `${a[0]} = ${a[1]} (${a[2]})!`, hint: 'Count them first, one by one.' }; },
  () => { const a = NUMS[R(NUMS.length)];
    return { q: `<span class="ta" style="font-size:44px">${a[1]}</span><br>Which number is this?`, choices: pick4(NUMS, a).map(x => ({ label: String(x[0]), ok: x === a })),
      yay: `${a[1]} (${a[2]}) = ${a[0]}!`, hint: 'Look at the Numbers board to check.' }; },
  () => { const a = COLS[R(COLS.length)];
    return { q: `<div style="width:110px;height:110px;border-radius:50%;margin:0 auto 8px;border:4px solid #eee;background:${a[3]}"></div>What colour is this, in Tamil?`,
      choices: pick4(COLS, a).map(x => ({ label: `<span class="ta">${x[0]}</span><br><small>${x[1]}</small>`, ok: x === a })), yay: `${a[2]} = ${a[0]} (${a[1]})!`, hint: 'Look at the Colours board to check.' }; },
];
let quizOn = false;
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  Kids.sfx.pop();
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('[data-panel]').forEach(p => p.hidden = p.dataset.panel !== b.dataset.tab);
  if (b.dataset.tab === 'quiz' && !quizOn) { quizOn = true; Kids.quiz('#quizBox', () => MAKERS[R(MAKERS.length)](), { rounds: 10, onRight: () => ch.check({ quiz: true }) }); }
}));

const ch = Kids.challenges([
  { ask: 'Tap number 5: ஐந்து (aindhu) ✋', hint: 'Five, like the fingers on one hand!', ok: c => c.n === 5, yay: 'ஐந்து: five fingers on your hand! ✋' },
  { ask: 'Count from 1 to 10 in Tamil: tap all the numbers 🔢', hint: 'Tap every number card.', ok: c => c.seenN >= 10, yay: 'ஒன்று to பத்து: you counted to ten in Tamil!' },
  { ask: 'Find the colour of a leaf 🍃', hint: 'Open Colours. Leaves are… green!', ok: c => c.col === 'green', yay: 'பச்சை (pachai): green like a leaf! 🍃' },
  { ask: 'Tap all 10 colours 🌈', hint: 'Open Colours and tap each one.', ok: c => c.seenC >= 10, yay: 'You know all the colours in Tamil! 🌈' },
  { ask: 'Play the Quiz and get one right ❓', hint: 'Open the Quiz tab.', ok: c => c.quiz, yay: 'Super! 🌺' },
], { title: 'Tamil Star' });

Kids.learn({
  why: ['Learning numbers and colours in Tamil helps you talk with family, read signs, and enjoy Tamil songs and stories.',
    'Every language has its own words for the same things. Now you know two ways to say five: five and ஐந்து!'],
  imagine: ['Imagine a rainbow where every colour sings its Tamil name: சிவப்பு, ஆரஞ்சு, மஞ்சள், பச்சை, நீலம், ஊதா…'],
  wow: ['Tamil has its own special symbols for numbers too! ௧ is one, ௨ is two, and ௫ is five.', 'Tamil is spoken by about 8 crore people around the world.'],
  talk: ['Count your toys in Tamil!', 'What colour is your favourite dress? Say it in Tamil.', 'Ask a grown-up to count to 10 in Tamil with you.'],
});
findVoice();
</script>
</body>
</html>
