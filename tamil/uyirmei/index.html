<script>
Kids.barakhadi({
  lang: 'ta', langName: 'Tamil', font: "'Tamil Sangam MN','Noto Sans Tamil','Latha','Nirmala UI',sans-serif", plus: c => c + '்',
  consonants: [['க','k'],['ங','ng'],['ச','ch'],['ஞ','nj'],['ட','T'],['ண','N'],['த','th'],['ந','n'],['ப','p'],['ம','m'],['ய','y'],['ர','r'],['ல','l'],['வ','v'],['ழ','zh'],['ள','L'],['ற','R'],['ன','nn']],
  vowels: [['அ','','a'],['ஆ','ா','aa'],['இ','ி','i'],['ஈ','ீ','ee'],['உ','ு','u'],['ஊ','ூ','oo'],['எ','ெ','e'],['ஏ','ே','ae'],['ஐ','ை','ai'],['ஒ','ொ','o'],['ஓ','ோ','oa'],['ஔ','ௌ','au']],
  words: [['கை','kai','hand','✋'],['பூ','poo','flower','🌸'],['மீன்','meen','fish','🐟'],['பால்','paal','milk','🥛'],['வீடு','veedu','house','🏠'],['நாய்','naai','dog','🐶'],
    ['பூனை','poonai','cat','🐱'],['கிளி','kili','parrot','🦜'],['மாடு','maadu','cow','🐄'],['தோசை','dosai','dosa','🥞'],['கடல்','kadal','sea','🌊'],['கொடி','kodi','flag','🚩'],

});
Kids.learn({
  why: ['When a மெய் (mei) letter, the body, meets an உயிர் (uyir) letter, the life, they make an உயிர்மெய் (uyirmei) letter: க் + ஆ = கா.',
    '18 mei × 12 uyir = 216 uyirmei letters. But you don\'t need to learn 216 things, just 12 signs!'],
  imagine: ['Imagine the mei letter is asleep, with its dot on top. When an uyir letter comes to visit, the dot flies away and the letter wakes up and sings! க் → கா 🎶'],
  wow: ['ெ, ே and ை are written BEFORE the letter, but said AFTER it: கெ = k + e.', 'ஒ, ஓ and ஔ signs go on BOTH sides of the letter, like a hug: கொ!'],
  talk: ['Can you read the word தமிழ் now?', 'Find uyirmei letters on a Tamil calendar or newspaper.', 'Read a word to Paati or Thatha on the phone!'],
});
