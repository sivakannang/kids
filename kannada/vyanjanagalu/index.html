<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ಕನ್ನಡ ವ್ಯಂಜನಗಳು · Kannada Vyanjanagalu</title>
<link rel="stylesheet" href="../../shared/kids.css?v=4">
</head>
<body>

<header>
  <div class="logo">
    <span class="big" style="font-family:'Kannada Sangam MN','Noto Sans Kannada','Tunga','Nirmala UI',sans-serif">ಕ</span>
    <div><h1>Kannada Vyanjanagalu <span style="font-family:'Kannada Sangam MN','Noto Sans Kannada','Tunga','Nirmala UI',sans-serif">ವ್ಯಂಜನಗಳು</span></h1><small>The Kannada consonants, <b data-kid-name>Kavikuyil</b>!</small></div>
  </div>
  <div class="badges" data-kids-badges data-home="../../index.html"></div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="learn">📖 Learn</button>
  <button class="tab" data-tab="quiz">❓ Quiz</button>
</nav>

<main data-letters></main>
<section data-learn></section>
<footer>Made with ❤️ for <span data-kid-name>Kavikuyil</span> · ಕನ್ನಡ 🌼</footer>

<script src="../../shared/kids.js?v=4"></script>
<script src="../../shared/letters.js?v=4"></script>
<script>
Kids.lettersGame({
  lang: 'kn', langName: 'Kannada', what: 'consonant', font: "'Kannada Sangam MN', 'Noto Sans Kannada', 'Tunga', 'Nirmala UI', sans-serif",
  kinds: {
    k1: { label: 'ಕ family (throat)', bg: 'linear-gradient(135deg, #f774c4, #e0409e)' },
    k2: { label: 'ಚ family (palate)', bg: 'linear-gradient(135deg, #ff9f1c, #f3722c)' },
    k3: { label: 'ಟ family (tongue up)', bg: 'linear-gradient(135deg, #9b5de5, #7b3fe0)' },
    k4: { label: 'ತ family (teeth)', bg: 'linear-gradient(135deg, #3aa6dd, #118ab2)' },
    k5: { label: 'ಪ family (lips)', bg: 'linear-gradient(135deg, #2ec4b6, #04a08a)' },
    k6: { label: 'Other letters', bg: 'linear-gradient(135deg, #8d99ae, #5c677d)' },
  },
  letters: [
    ['ಕ', 'ka', 'k1', 'ಕಮಲ', 'kamala', 'lotus', '🪷'],
    ['ಖ', 'kha', 'k1', 'ಖಡ್ಗ', 'khadga', 'sword', '🗡️'],
    ['ಗ', 'ga', 'k1', 'ಗಡಿಯಾರ', 'gadiyaara', 'clock', '⏰'],
    ['ಘ', 'gha', 'k1', 'ಘಂಟೆ', 'ghante', 'bell', '🔔'],
    ['ಙ', 'nga', 'k1', '', '', 'A nose sound, "ng". It is very rare, and hides inside a few old words.', ''],
    ['ಚ', 'cha', 'k2', 'ಚಮಚ', 'chamacha', 'spoon', '🥄'],
    ['ಛ', 'chha', 'k2', 'ಛತ್ರಿ', 'chhatri', 'umbrella', '☂️'],
    ['ಜ', 'ja', 'k2', 'ಜಿಂಕೆ', 'jinke', 'deer', '🦌'],
    ['ಝ', 'jha', 'k2', 'ಝರಿ', 'jhari', 'little waterfall', '🏞️'],
    ['ಞ', 'nya', 'k2', '', '', 'A nose sound, "ny". It is very rare, like in ಜ್ಞಾನ (gnaana, knowledge).', ''],
    ['ಟ', 'Ta (hard)', 'k3', 'ಟಗರು', 'tagaru', 'ram (a male sheep)', '🐏'],
    ['ಠ', 'Tha (hard)', 'k3', '', '', 'A breathy hard "Tha". Only a few words use it.', ''],
    ['ಡ', 'Da (hard)', 'k3', 'ಡಬ್ಬಿ', 'dabbi', 'box', '📦'],
    ['ಢ', 'Dha (hard)', 'k3', 'ಢಕ್ಕೆ', 'dhakke', 'big drum', '🥁'],
    ['ಣ', 'Na (hard)', 'k3', '', '', 'No words start with it! It comes in the middle, like ಬಾಣ (baana, arrow) 🏹.', ''],
    ['ತ', 'ta', 'k4', 'ತಬಲ', 'tabala', 'tabla drums', '🪘'],
    ['ಥ', 'tha', 'k4', '', '', 'A breathy "tha". It comes at the end of words like ರಥ (ratha, chariot).', ''],
    ['ದ', 'da', 'k4', 'ದೀಪ', 'deepa', 'lamp', '🪔'],
    ['ಧ', 'dha', 'k4', 'ಧ್ವಜ', 'dhvaja', 'flag', '🚩'],
    ['ನ', 'na', 'k4', 'ನವಿಲು', 'navilu', 'peacock', '🦚'],
    ['ಪ', 'pa', 'k5', 'ಪಟ', 'pata', 'kite', '🪁'],
    ['ಫ', 'pha', 'k5', 'ಫಲ', 'phala', 'fruit', '🍎'],
    ['ಬ', 'ba', 'k5', 'ಬಾಳೆಹಣ್ಣು', 'baalehannu', 'banana', '🍌'],
    ['ಭ', 'bha', 'k5', 'ಭೂಮಿ', 'bhoomi', 'the Earth', '🌍'],
    ['ಮ', 'ma', 'k5', 'ಮರ', 'mara', 'tree', '🌳'],
    ['ಯ', 'ya', 'k6', 'ಯಂತ್ರ', 'yantra', 'machine', '⚙️'],
    ['ರ', 'ra', 'k6', 'ರೈಲು', 'railu', 'train', '🚆'],
    ['ಲ', 'la', 'k6', 'ಲೋಟ', 'lota', 'tumbler', '🥛'],
    ['ವ', 'va', 'k6', 'ವಜ್ರ', 'vajra', 'diamond', '💎'],
    ['ಶ', 'sha', 'k6', 'ಶಂಖ', 'shankha', 'conch shell', '🐚'],
    ['ಷ', 'Sha (hard)', 'k6', 'ಷಟ್ಕೋನ', 'shatkona', 'hexagon (6 sides)', '⬡'],
    ['ಸ', 'sa', 'k6', 'ಸಿಂಹ', 'simha', 'lion', '🦁'],
    ['ಹ', 'ha', 'k6', 'ಹಸು', 'hasu', 'cow', '🐄'],
    ['ಳ', 'La (hard)', 'k6', '', '', 'A special Kannada "La", with the tongue curled back. It lives inside words like ಬಾಳೆ (baale, banana).', ''],
  ],
});
Kids.learn({
  why: ['ವ್ಯಂಜನಗಳು (vyanjanagalu) are the consonants. Each one has a little "a" sound inside: ಕ says "ka".',
    'The first 25 letters come in 5 families of 5. Each family is made in a different part of your mouth!'],
  imagine: ['Look at the round, curly Kannada letters. They look like little bubbles and swirls. Which one looks like a smiling face? 😊'],
  wow: ['Kannada is the language of Karnataka, where Bangalore (Bengaluru) is! Look for it on bus boards and shop signs.',
    'Kannada and Telugu letters are cousins: they grew from the same old script, so many look alike.'],
  talk: ['Can you read a Kannada word on a sign when you go out?', 'Ask a friend at school to say ನವಿಲು (navilu). What does it mean?', 'Which letter is the curliest?'],
});
</script>
</body>
</html>
