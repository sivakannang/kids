<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ಕಾಗುಣಿತ · Kannada Kagunita</title>
<link rel="stylesheet" href="../../shared/kids.css?v=5">
</head>
<body>

<header>
  <div class="logo">
    <span class="big" style="font-family:'Kannada Sangam MN','Noto Sans Kannada','Tunga','Nirmala UI',sans-serif">ಕಾ</span>
    <div><h1>Kannada Kagunita <span style="font-family:'Kannada Sangam MN','Noto Sans Kannada','Tunga','Nirmala UI',sans-serif">ಕಾಗುಣಿತ</span></h1><small>Add a vowel sign to a letter and it says something new, <b data-kid-name>Kavikuyil</b>!</small></div>
  </div>
  <div class="badges" data-kids-badges data-home="../../index.html"></div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="chart">🧩 Letter Chart</button>
  <button class="tab" data-tab="read">📖 Read Words</button>
  <button class="tab" data-tab="quiz">❓ Quiz</button>
</nav>

<main data-barakhadi></main>
<section data-learn></section>
<footer>Made with ❤️ for <span data-kid-name>Kavikuyil</span> · ಕನ್ನಡ 🌼</footer>

<script src="../../shared/kids.js?v=5"></script>
<script src="../../shared/barakhadi.js?v=5"></script>
<script>
Kids.barakhadi({
  lang: 'kn', langName: 'Kannada', font: "'Kannada Sangam MN','Noto Sans Kannada','Tunga','Nirmala UI',sans-serif",
  consonants: [['ಕ','k'],['ಗ','g'],['ಚ','ch'],['ಜ','j'],['ಟ','T'],['ಡ','D'],['ತ','t'],['ದ','d'],['ನ','n'],['ಪ','p'],['ಬ','b'],['ಮ','m'],['ಯ','y'],['ರ','r'],['ಲ','l'],['ವ','v'],['ಸ','s'],['ಹ','h']],
  vowels: [['ಅ','','a'],['ಆ','ಾ','aa'],['ಇ','ಿ','i'],['ಈ','ೀ','ee'],['ಉ','ು','u'],['ಊ','ೂ','oo'],['ಋ','ೃ','ru'],['ಎ','ೆ','e'],['ಏ','ೇ','ae'],['ಐ','ೈ','ai'],['ಒ','ೊ','o'],['ಓ','ೋ','oa'],['ಔ','ೌ','au'],['ಅಂ','ಂ','am'],['ಅಃ','ಃ','aha']],
  words: [['ಮನೆ','mane','house','🏠'],['ಹಾಲು','haalu','milk','🥛'],['ಮೀನು','meenu','fish','🐟'],['ಕೋತಿ','koti','monkey','🐒'],['ಬೆಕ್ಕು','bekku','cat','🐱'],['ನಾಯಿ','naayi','dog','🐶'],
    ['ಹೂವು','hoovu','flower','🌸'],['ಮರ','mara','tree','🌳'],['ಆನೆ','aane','elephant','🐘'],['ಕಿವಿ','kivi','ear','👂'],['ಮೂಗು','moogu','nose','👃'],['ಗಿಳಿ','gili','parrot','🦜'],
    ['ದೋಣಿ','doni','boat','⛵'],['ಸೇಬು','sebu','apple','🍎']],
});
Kids.learn({
  why: ['ಕಾಗುಣಿತ (kagunita) is how Kannada letters wear vowel signs: ಕ (ka) + ಾ = ಕಾ (kaa).',
    'Learn the signs once, and they work on every letter. Then you can read signboards all over Bengaluru!'],
  imagine: ['Imagine each sign is a tiny tail, hook or hat. ಿ is a little hat on top: ಕಿ (ki). ು is a curly tail: ಕು (ku).'],
  wow: ['Kannada has been written for more than 1,500 years!', 'ಕೆ (ke) and ಕೇ (kae) look almost the same. The long one has an extra little tail. Look closely!'],
  talk: ['Read a Kannada word on a bus or shop board with a grown-up.', 'Ask a Kannada-speaking friend to read ಮನೆ and ಮರ with you.', 'Which sign looks the funniest?'],
});
</script>
</body>
</html>
