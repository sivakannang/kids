<script src="../../shared/letters.js?v=4"></script>
<script>
Kids.lettersGame({
  lang: 'kn', langName: 'Kannada', font: "'Kannada Sangam MN', 'Noto Sans Kannada', 'Tunga', 'Nirmala UI', sans-serif",
  letters: [
    ['ಅ', 'a', 'short', 'ಅಮ್ಮ', 'amma', 'mother', '👩'],
    ['ಆ', 'aa', 'long', 'ಆನೆ', 'aane', 'elephant', '🐘'],
    ['ಇ', 'i', 'short', 'ಇಲಿ', 'ili', 'mouse', '🐭'],
    ['ಈ', 'ee', 'long', 'ಈರುಳ್ಳಿ', 'eerulli', 'onion', '🧅'],
    ['ಉ', 'u', 'short', 'ಉಂಗುರ', 'ungura', 'ring', '💍'],
    ['ಊ', 'oo', 'long', 'ಊಟ', 'oota', 'meal', '🍛'],
    ['ಋ', 'ru', 'extra', 'ಋಷಿ', 'rushi', 'wise sage', '🧘'],
    ['ಎ', 'e', 'short', 'ಎಲೆ', 'ele', 'leaf', '🍃'],
    ['ಏ', 'ae', 'long', 'ಏಣಿ', 'aeni', 'ladder', '🪜'],
    ['ಐ', 'ai', 'long', 'ಐದು', 'aidu', 'five', '5️⃣'],
    ['ಒ', 'o', 'short', 'ಒಂಟೆ', 'onte', 'camel', '🐫'],

Kids.learn({
  why: ['Kannada is the language of Karnataka, the state where Bangalore is! Learning it helps you talk with friends, read signs and understand your neighbours.',

  imagine: ['Imagine walking down a street in Bangalore and reading every shop sign all by yourself: ಅಂಗಡಿ (angadi, shop)! 🏪'],
  wow: ['Kannada and Telugu letters look a lot alike, because they grew from the same old script!', 'Kannada writing is more than 1,500 years old.'],
  talk: ['Which Kannada words do your friends at school use?', 'Can you find a Kannada sign on your way to school?', 'How do you say "thank you" in Kannada? (ಧನ್ಯವಾದ, dhanyavaada)'],
