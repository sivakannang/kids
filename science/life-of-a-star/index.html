<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life of a Star</title>
<link rel="stylesheet" href="../../shared/kids.css?v=4">
<style>
  .stage-name { text-align: center; font-size: 30px; font-weight: 700; color: #ffd166; margin-top: 6px; }
  .stage-text { text-align: center; font-size: 19px; min-height: 58px; max-width: 640px; margin: 6px auto 0; }
  .timeline { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  .timeline span { width: 40px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.2); }
  .timeline span.on { background: #ffd166; }
  .colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .col { border: none; border-radius: 16px; padding: 12px 4px; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 15px; color: #2b2d42; }
  .col .dot { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px; box-shadow: 0 0 18px currentColor; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="big">⭐</span>
    <div><h1>Life of a Star</h1><small>Stars are born, shine, and change, <b data-kid-name>Kavikuyil</b>!</small></div>
  </div>
  <div class="badges" data-kids-badges data-home="../../index.html"></div>
</header>

<main class="split">
  <div>
    <section class="card space-card">
      <h2>🌌 Watch a star's life <small>Pick how big the star is, then press Next to move through its life.</small></h2>
      <div class="pick" id="massPick">
        <button data-m="1" class="active">☀️ Like our Sun</button>
        <button data-m="10">⭐ 10 times bigger</button>
        <button data-m="25">🌟 25 times bigger</button>
      </div>
      <svg id="star" class="svgbox" viewBox="-300 -170 600 340" style="margin-top:10px"></svg>
      <div class="stage-name" id="sName"></div>
      <div class="stage-text" id="sText"></div>
      <div class="timeline" id="timeline"></div>
      <div class="row">
        <button class="btn orange" id="backBtn">⏮️ Back</button>
        <button class="btn big green" id="nextBtn">Next ⏭️</button>
        <button class="btn purple" id="readBtn">🔊 Read</button>
      </div>
    </section>
  </div>
  <div>
    <section class="card">
      <h3 style="margin:0 0 8px">🌡️ Star colours: which is hottest?</h3>
      <div class="colors" id="colors"></div>
      <div class="result" id="colRes">Tap a colour!</div>
    </section>
    <section class="card" data-kuyil></section>
  </div>
</main>

<section data-learn></section>
<footer>Made with ❤️ for <span data-kid-name>Kavikuyil</span> · Part of the Curiosity Journey 🌌</footer>

<script src="../../shared/kids.js?v=4"></script>
<script>
const $ = s => document.querySelector(s);
const el = Kids.svgEl;
const START = [
  { id: 'nebula', n: '☁️ Star nursery (nebula)', t: 'Every star begins as a giant cloud of gas and dust. Slowly, gravity pulls the cloud together.' },
  { id: 'baby', n: '🍼 Baby star', t: 'The cloud squeezes into a hot, spinning ball. It gets hotter and hotter…' },
];
const SMALL = [
  { id: 'main', n: '☀️ Shining star', t: 'It starts to shine! Our Sun is at this stage now. It is about 4.6 billion years old, about halfway through its life.' },
  { id: 'red', n: '🔴 Red giant', t: 'Billions of years later, it swells into a huge red giant. Our Sun may grow big enough to swallow Mercury and Venus!' },
  { id: 'ring', n: '💫 Glowing smoke ring', t: 'It gently puffs its outside layers into space, making a beautiful glowing ring of gas.' },
  { id: 'white', n: '⚪ White dwarf', t: 'What is left is a tiny, very hot star, about the size of the Earth. It slowly cools down for a very, very long time.' },
];
const BIG = [
  { id: 'blue', n: '🔵 Blue giant', t: 'Big stars shine hot and blue. But they live much shorter lives: only a few million years.' },
  { id: 'super', n: '🔴 Red supergiant', t: 'It swells into an enormous red supergiant. The star Betelgeuse, in the Orion stars, is one!' },
  { id: 'boom', n: '💥 SUPERNOVA!', t: 'BOOM! The star explodes. For a few weeks it can shine brighter than a whole galaxy of stars!' },
];
const NEUTRON = { id: 'neutron', n: '🔘 Neutron star', t: 'Left behind is a tiny, super-heavy ball, only as big as a city. One spoonful would weigh as much as a mountain!' };
const HOLE = { id: 'hole', n: '⚫ Black hole', t: 'The biggest stars squeeze into a black hole: gravity so strong that not even light can escape!' };
let mass = 1, i = 0;
const path = () => mass === 1 ? [...START, ...SMALL] : [...START, ...BIG, mass >= 25 ? HOLE : NEUTRON];

function draw() {
  const st = path()[i], s = $('#star');
  s.innerHTML = `<defs>
    <radialGradient id="glow"><stop offset="0%" stop-color="#fff"/><stop offset="35%" style="stop-color:var(--c)"/><stop offset="100%" style="stop-color:var(--c);stop-opacity:0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter></defs>`;
  for (let k = 0; k < 70; k++) el('circle', { cx: Math.random() * 600 - 300, cy: Math.random() * 340 - 170, r: Math.random() * 1.3 + .3, fill: '#fff', opacity: .5 }, s);
  const glow = (r, c, extra = 1.8) => { s.style.setProperty('--c', c); el('circle', { r: r * extra, fill: 'url(#glow)' }, s); el('circle', { r, fill: c }, s); };
  switch (st.id) {
    case 'nebula':
      [['#9b5de5', -60, -20, 90], ['#f15bb5', 50, 10, 80], ['#00bbf9', 0, 40, 70], ['#ffd166', -20, -40, 50]].forEach(([c, x, y, r]) =>
        el('circle', { cx: x, cy: y, r, fill: c, opacity: .55, filter: 'url(#blur)' }, s));
      break;
    case 'baby':
      el('circle', { r: 90, fill: '#f15bb5', opacity: .35, filter: 'url(#blur)' }, s); glow(34, '#ff9f68'); break;
    case 'main': glow(60, '#ffd166'); break;
    case 'red': glow(130, '#ff5a36', 1.3); break;
    case 'ring':
      el('circle', { r: 110, fill: 'none', stroke: '#00f5d4', 'stroke-width': 26, opacity: .6, filter: 'url(#blur)' }, s);
      el('circle', { r: 110, fill: 'none', stroke: '#f15bb5', 'stroke-width': 10, opacity: .7 }, s);
      glow(10, '#ffffff', 3); break;
    case 'white': glow(12, '#e8f4ff', 3); break;
    case 'blue': glow(80, '#6ec6ff'); break;
    case 'super': glow(150, '#ff3b1f', 1.15); break;
    case 'boom':
      for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; el('line', { x1: 0, y1: 0, x2: Math.cos(a) * 160, y2: Math.sin(a) * 160, stroke: k % 2 ? '#ffd166' : '#ff6b6b', 'stroke-width': 6, opacity: .8 }, s); }
      glow(60, '#fff7c2', 2.4); break;
    case 'neutron': glow(10, '#a0c4ff', 4);
      el('line', { x1: 0, y1: -150, x2: 0, y2: 150, stroke: '#a0c4ff', 'stroke-width': 3, opacity: .6 }, s); break;
    case 'hole':
      el('ellipse', { rx: 140, ry: 34, fill: 'none', stroke: '#ff9f1c', 'stroke-width': 18, opacity: .8, filter: 'url(#blur)' }, s);
      el('ellipse', { rx: 120, ry: 26, fill: 'none', stroke: '#ffd166', 'stroke-width': 6 }, s);
      el('circle', { r: 46, fill: '#000' }, s);
      el('circle', { r: 50, fill: 'none', stroke: '#ffb347', 'stroke-width': 3, opacity: .9 }, s); break;
  }
  $('#sName').textContent = st.n; $('#sText').textContent = st.t;
  $('#timeline').innerHTML = path().map((_, k) => `<span class="${k <= i ? 'on' : ''}"></span>`).join('');
  $('#backBtn').disabled = i === 0; $('#nextBtn').disabled = i === path().length - 1;
  ch.check({ mass, stage: st.id, last: i === path().length - 1 });
}
function go(d) {
  const n = i + d; if (n < 0 || n >= path().length) return;
  i = n; path()[i].id === 'boom' ? Kids.sfx.boing() : Kids.sfx.whoosh();
  if (path()[i].id === 'boom') Kids.confetti();
  draw(); Kids.speak(Kids.forSpeech(`${path()[i].n}. ${path()[i].t}`));
}
$('#nextBtn').addEventListener('click', () => go(1));
$('#backBtn').addEventListener('click', () => go(-1));
$('#readBtn').addEventListener('click', () => Kids.speak(Kids.forSpeech(`${path()[i].n}. ${path()[i].t}`), true));
$('#massPick').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  mass = +b.dataset.m; i = 0; Kids.sfx.pop();
  $('#massPick').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b)); draw();
}));

const COLORS = [
  { c: '#ff5a36', n: 'Red', t: 3000, msg: 'Red stars are the COOLEST stars: about 3,000°C. Still super hot!' },
  { c: '#ffd166', n: 'Yellow', t: 5500, msg: 'Yellow stars, like our Sun, are about 5,500°C on the outside.' },
  { c: '#f8f9ff', n: 'White', t: 10000, msg: 'White stars are about 10,000°C!' },
  { c: '#6ec6ff', n: 'Blue', t: 25000, msg: 'Blue stars are the HOTTEST: 20,000°C or more! 🔥' },
];
COLORS.forEach(col => {
  const b = document.createElement('button');
  b.className = 'col'; b.style.background = col.c + '33'; b.style.color = col.c;
  b.innerHTML = `<div class="dot" style="background:${col.c}"></div><span style="color:#2b2d42">${col.n}</span>`;
  b.addEventListener('click', () => { $('#colRes').textContent = col.msg; Kids.sfx.pop(); Kids.speak(Kids.forSpeech(col.msg)); ch.check({ color: col.n }); });
  $('#colors').appendChild(b);
});

const ch = Kids.challenges([
  { ask: 'Follow our SUN\'s whole life to the very end ☀️', hint: 'Pick "Like our Sun" and keep pressing Next.', ok: c => c.mass === 1 && c.last, yay: 'Our Sun will end as a white dwarf, but not for about 5 billion years!' },
  { ask: 'Make a SUPERNOVA explosion 💥', hint: 'Pick a BIG star and press Next until… BOOM!', ok: c => c.stage === 'boom', yay: 'BOOM! Supernovas spread star-stuff across space.' },
  { ask: 'Make a BLACK HOLE ⚫', hint: 'Only the very biggest stars become black holes. Pick 25 times bigger!', ok: c => c.stage === 'hole', yay: 'A black hole: not even light can escape!' },
  { ask: 'Make a NEUTRON STAR 🔘', hint: 'Try a star that is 10 times bigger than the Sun.', ok: c => c.stage === 'neutron', yay: 'A neutron star: as small as a city, but heavier than the Sun!' },
  { ask: 'Find the HOTTEST star colour 🌡️', hint: 'It is not red! Try the colours.', ok: c => c.color === 'Blue', yay: 'Blue stars are the hottest. Red stars are the coolest.' },
], { title: 'Star Scientist' });

Kids.learn({
  why: ['Stars are giant balls of hot gas. Deep inside, they squeeze tiny bits of gas together so hard that they make light and heat. That\'s why they shine!',
    'Small stars live a long, calm life. Big stars live fast and end with a huge explosion.'],
  imagine: ['Imagine a soft, colourful cloud in space, bigger than a million Solar Systems. Inside it, tiny baby stars are starting to glow, like fireflies waking up. ✨'],
  wow: ['You are made of star-stuff! The iron in your blood and the calcium in your bones were made inside stars long, long ago.',
    'Our Sun is a star too. The other stars only look tiny because they are SO far away.'],
  talk: ['If you could name a star, what would you call it?', 'Why do you think stars twinkle?', 'Which part of a star\'s life is your favourite?'],
});
draw();
</script>
</body>
</html>
