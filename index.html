<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Learning World</title>
<link rel="stylesheet" href="shared/kids.css?v=5">
<style>
  main { max-width: 1200px; margin: 0 auto; padding: 0 18px 10px; }
  .hello { text-align: center; margin: 4px 0 22px; font-size: 22px; color: var(--muted); }
  .hello b { color: var(--purple); }
  .subject { margin-bottom: 26px; }
  .subject h2 { margin: 0 0 12px; font-size: 26px; display: flex; align-items: center; gap: 10px; }
  .subject h2 .pill { font-size: 14px; font-weight: 600; background: #fff; border-radius: 999px; padding: 3px 12px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .tile {
    position: relative; display: block; text-decoration: none; color: #fff; border-radius: 26px; padding: 18px 18px 20px;
    min-height: 150px; box-shadow: 0 7px 0 rgba(0,0,0,.15); transition: transform .15s, box-shadow .15s; overflow: hidden;
  }
  a.tile:hover { transform: translateY(-4px) rotate(-1deg); box-shadow: 0 11px 0 rgba(0,0,0,.15); }
  a.tile:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .tile .emoji { font-size: 52px; line-height: 1; display: inline-block; }
  a.tile:hover .emoji { animation: wobble .8s ease-in-out infinite; }
  .tile h3 { margin: 10px 0 4px; font-size: 22px; }
  .tile p { margin: 0; font-size: 15px; opacity: .95; line-height: 1.3; }
  .tile .tag { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,.3); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
  .tile.soon { background: #fff !important; color: var(--muted); box-shadow: 0 5px 0 rgba(0,0,0,.06); border: 3px dashed #ddd8f0; }
  .tile.soon .emoji { filter: grayscale(.6); opacity: .7; }
  .c-purple { background: linear-gradient(135deg, #9b5de5, #7b3fe0); }
  .c-blue   { background: linear-gradient(135deg, #3aa6dd, #118ab2); }
  .c-green  { background: linear-gradient(135deg, #2ed3a2, #04a57c); }
  .c-orange { background: linear-gradient(135deg, #ffb347, #ff8a00); }
  .c-pink   { background: linear-gradient(135deg, #f774c4, #e0409e); }
  .c-red    { background: linear-gradient(135deg, #ff7a93, #ef476f); }
  .c-teal   { background: linear-gradient(135deg, #48cae4, #0096c7); }
  .c-sun    { background: linear-gradient(135deg, #ffd166, #f8961e); }
  .who h2 { text-align: center; margin: 4px 0 12px; font-size: 26px; }
  .kids { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .kidcard { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); background: #fff; border-radius: 26px; padding: 12px 22px; border: 5px solid transparent; box-shadow: 0 6px 0 rgba(0,0,0,.08); transition: transform .15s; }
  .kidcard:hover { transform: translateY(-3px); }
  .kidcard .av { font-size: 56px; }
  .kidcard b { font-size: 24px; display: block; }
  .kidcard small { color: var(--muted); font-size: 15px; }
  .kidcard.on { border-color: var(--purple); background: #f6f1ff; }
  .practice { margin: 0 0 26px; }
  .practice h2 { margin: 0 0 4px; font-size: 24px; }
  .ptasks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; }
  .ptask { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); background: #f6f3ff; border-radius: 20px; padding: 12px 14px; border: 3px solid transparent; }
  .ptask .e { font-size: 40px; }
  .ptask b { display: block; font-size: 18px; }
  .ptask small { color: var(--muted); }
  .ptask.done { background: #d3f8e2; border-color: #06d6a0; }
  .ptask .chk { margin-left: auto; font-size: 28px; }
  .pstat { font-size: 17px; color: var(--muted); }
</style>
</head>

SUBJECTS.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

const PLAN = {
  kavikuyil: [
    ['hindi/swar', 'hindi/vyanjan', 'hindi/matras', 'kannada/kagunita', 'tamil/uyirmei', 'kannada/swaragalu', 'kannada/vyanjanagalu', 'tamil/uyir-ezhuthukkal', 'tamil/mei-ezhuthukkal', 'tamil/animal-words', 'languages/word-explorer', 'tamil/numbers-colours'],
    ['maths/time-words', 'maths/birthday-calendar', 'maths/world-clock', 'maths/money-shop', 'maths/time-ladder'],
    ['english/word-match', 'english/story-time', 'english/rhyme-time', 'maths/number-bonds', 'maths/times-tables', 'science/weather-watch', 'science/how-plants-grow', 'world/continents-puzzle', 'world/states-and-countries', 'mind/feelings-check-in', 'maths/fraction-pizza', 'science/volcanoes', 'science/eclipse', 'mind/gratitude-jar', 'science/planet-jump', 'mind/focus-garden'],
  ],
  prabanjan: [
    ['little/letter-sounds', 'little/blend-it', 'little/trace-it', 'little/sight-words'],
    ['little/number-friends', 'maths/counting-fun', 'little/trace-it'],
    ['little/story-time', 'little/rhyme-and-sing', 'little/sentence-builder', 'little/picture-talk', 'little/colours-shapes', 'science/animal-homes'],
  ],
}[P.id];
const allItems = SUBJECTS.flatMap(sub => sub.items.filter(i => i.path));
const dayNo = Math.floor(new Date(new Date().toDateString()) / 86400000);
const picks = [...new Set(PLAN.map((pool, k) => pool[(dayNo + k) % pool.length]))];
const doneToday = Kids.store.get(`day.${Kids.today()}`, {});
const tasks = picks.map(key => ({ key, item: allItems.find(i => i.path.startsWith(key + '/')), done: !!doneToday[key] })).filter(t => t.item);
const allDone = tasks.every(t => t.done);
// streak of days with all practice done
let days = Kids.store.get('practice.days', []);
if (allDone && !days.includes(Kids.today())) { days.push(Kids.today()); Kids.store.set('practice.days', days); }
let streak = 0; { const d = new Date(); if (!days.includes(Kids.today())) d.setDate(d.getDate() - 1);
  const key = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  while (days.includes(key(d))) { streak++; d.setDate(d.getDate() - 1); } }
document.getElementById('practice').innerHTML = `
  <h2>📝 ${P.nick}'s practice for today</h2>
  <div class="pstat">${allDone ? `🎉 All done! Wonderful, ${P.nick}!` : `Finish these ${tasks.length} little games (win at least one ⭐ in each).`} ${streak ? ` · 🔥 ${streak} day${streak > 1 ? 's' : ''} in a row` : ''}</div>
  <div class="ptasks">${tasks.map(t => `<a class="ptask ${t.done ? 'done' : ''}" href="${t.item.path}">
    <span class="e">${t.item.emoji}</span><span><b>${t.item.name}</b><small>${t.item.about}</small></span><span class="chk">${t.done ? '✅' : '⬜'}</span></a>`).join('')}</div>`;
if (allDone && !Kids.store.get(`practice.cheered.${Kids.today()}`, false)) {
  Kids.store.set(`practice.cheered.${Kids.today()}`, true);
  setTimeout(() => { Kids.confetti(); Kids.banner(`🏆 All of today's practice done, ${P.nick}!`); Kids.speak(`Hooray! All of today's practice is done, ${P.nick}! I am so proud of you!`); }, 600);
}

const box = document.getElementById('subjects');
for (const s of SUBJECTS) {
  const ready = s.items.filter(i => i.path).length;
  const sec = document.createElement('section');
  sec.className = 'subject';
  sec.innerHTML = `<h2>${s.title} <span class="pill">${ready ? `${ready} ready` : 'coming soon'}</span></h2><div class="tiles"></div>`;
  const tiles = sec.querySelector('.tiles');
  for (const it of s.items) {
    const t = document.createElement(it.path ? 'a' : 'div');
    t.className = `tile ${s.color}${it.path ? '' : ' soon'}`;
    if (it.path) { t.href = it.path; t.addEventListener('click', () => Kids.sfx.pop()); }
    t.innerHTML = `<span class="tag">${it.path ? (it.tag || 'Play') : '🔒 Soon'}</span>
      <span class="emoji">${it.emoji}</span><h3>${it.name}</h3><p>${it.about}</p>`;
    tiles.appendChild(t);
  }
  box.appendChild(sec);
}

const h = new Date().getHours();
const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
document.getElementById('hello').innerHTML =
  `${greet}, <b>${P.name}</b> (${P.nick})! 👋 You have <b>⭐ ${Kids.stars}</b> stars. What shall we learn today?`;
</script>
</body>
</html>
